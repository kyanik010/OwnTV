name: Patch audio source v3
on:
  push:
    branches: [ main ]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch
        shell: bash
        run: |
          set -euo pipefail
          echo patch-v3 > AUDIO_PATCH_MARKER.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add AUDIO_PATCH_MARKER.txt
          git commit -m 'Audio source patch marker'
          git push
