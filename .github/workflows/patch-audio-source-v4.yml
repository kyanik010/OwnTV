name: Patch audio source v4
on:
  push:
    branches: [ main ]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply feature
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def r(path, old, new):
              p=Path(path)
              s=p.read_text()
              if old not in s:
                  raise SystemExit(f'MISSING: {path}: {old[:160]}')
              p.write_text(s.replace(old,new,1))

          Path('app/src/main/java/tv/own/owntv/player/ExternalAudioController.kt').write_text(r'''package tv.own.owntv.player

import java.lang.reflect.Modifier

object ExternalAudioController {
    private const val MPV_CLASS = "dev.jdtech.mpv.MPVLib"
    private var originalAid: Int? = null
    private var active = false
    private fun invoke(name: String, vararg args: Any?): Any? {
        val clazz = Class.forName(MPV_CLASS)
        val method = clazz.methods.firstOrNull { it.name == name && it.parameterTypes.size == args.size }
            ?: error("MPVLib.$name not found")
        val receiver = if (Modifier.isStatic(method.modifiers)) null else clazz.getField("INSTANCE").get(null)
        return method.invoke(receiver, *args)
    }
    private fun aid(): Int? = runCatching { (invoke("getPropertyString", "aid") as? String)?.toIntOrNull() }.getOrNull()
    fun setSource(url: String, title: String) {
        if (url.isBlank()) return
        runCatching {
            if (active) runCatching { invoke("command", arrayOf("audio-remove")) }
            originalAid = aid()
            invoke("command", arrayOf("audio-add", url, "select", title, ""))
            active = true
        }
    }
    fun clear() {
        runCatching {
            if (active) invoke("command", arrayOf("audio-remove"))
            originalAid?.let { invoke("setPropertyInt", "aid", it) } ?: invoke("setPropertyString", "aid", "auto")
        }
        active = false
        originalAid = null
    }
}
''')

          r('app/src/main/java/tv/own/owntv/player/PlayerHudDialogs.kt',
            '    onSelect: (TrackOption) -> Unit,\n    onOff: (() -> Unit)?,\n    onDismiss: () -> Unit,',
            '    onSelect: (TrackOption) -> Unit,\n    onOff: (() -> Unit)?,\n    onDismiss: () -> Unit,\n    onAudioSource: (() -> Unit)? = null,\n    onClearAudioSource: (() -> Unit)? = null,')

          anchor='''        // ADD SUBTITLES (subtitles dialog, movie/episode only) — OpenSubtitles search + local file (§4/§7).
        if (onSearchSubtitles != null || onSelectLocalSubtitle != null) {'''
          block='''        if (onAudioSource != null || onClearAudioSource != null) {
            item {
                Text(stringResource(R.string.player_audio_source), style = MaterialTheme.typography.labelSmall, color = colors.onSurfaceVariant, fontWeight = FontWeight.SemiBold, modifier = Modifier.padding(start = 16.dp, top = 10.dp, bottom = 2.dp))
            }
            if (onAudioSource != null) item { OptionRow(label = stringResource(R.string.player_audio_source), selected = false, onClick = onAudioSource) }
            if (onClearAudioSource != null) item { OptionRow(label = stringResource(R.string.player_audio_original), selected = false, onClick = onClearAudioSource) }
        }

''' + anchor
          r('app/src/main/java/tv/own/owntv/player/PlayerHudDialogs.kt',anchor,block)

          r('app/src/main/java/tv/own/owntv/player/PlayerHud.kt',
            '    onSelectLocalSubtitle: (() -> Unit)? = null,\n    // Favorite toggle for the CURRENT item',
            '    onSelectLocalSubtitle: (() -> Unit)? = null,\n    onOpenAudioSource: (() -> Unit)? = null,\n    onClearAudioSource: (() -> Unit)? = null,\n    // Favorite toggle for the CURRENT item')
          r('app/src/main/java/tv/own/owntv/player/PlayerHud.kt',
            '                onDismiss = { dialog = HudDialog.NONE },\n                // A/V-sync nudge wherever the engine can actually shift audio:',
            '                onDismiss = { dialog = HudDialog.NONE },\n                onAudioSource = onOpenAudioSource?.let { open -> { dialog = HudDialog.NONE; open() } },\n                onClearAudioSource = onClearAudioSource?.let { clear -> { clear() } },\n                // A/V-sync nudge wherever the engine can actually shift audio:')

          shell='app/src/main/java/tv/own/owntv/features/shell/OwnTVShell.kt'
          r(shell,
            '    var showHistoryList by remember { mutableStateOf(false) }\n    // Multiview:',
            '    var showHistoryList by remember { mutableStateOf(false) }\n    var showAudioSource by remember { mutableStateOf(false) }\n    // Multiview:')
          r(shell,
            'import tv.own.owntv.player.AudioNowPlayingBar\n',
            'import tv.own.owntv.player.AudioNowPlayingBar\nimport tv.own.owntv.player.ExternalAudioController\n')
          r(shell,
            'inert = showChannelList || showHistoryList || showCategoryBrowser || showSubtitleSearch || showLocalSubPicker,',
            'inert = showChannelList || showHistoryList || showAudioSource || showCategoryBrowser || showSubtitleSearch || showLocalSubPicker,')
          r(shell,
            '                    onToggleVodEngine = if (!isLiveStream && !isTunedLive) player::toggleVodEngine else null,\n                    // ADD SUBTITLES entry:',
            '''                    onToggleVodEngine = if (!isLiveStream && !isTunedLive) player::toggleVodEngine else null,
                    onOpenAudioSource = if (isTunedLive) {
                        {
                            if (liveOnExo) scope.launch { liveVm.toggleForceMpv(); kotlinx.coroutines.delay(1200); showAudioSource = true }
                            else showAudioSource = true
                        }
                    } else null,
                    onClearAudioSource = if (isTunedLive) { { ExternalAudioController.clear() } } else null,
                    // ADD SUBTITLES entry:''')

          anchor2='''                // Left — the playing channel's own provider category.
                if (showChannelList && isLiveChannel) {'''
          block2='''                if (showAudioSource && isLiveChannel) {
                    if (showCategoryBrowser) {
                        tv.own.owntv.features.shell.components.CategoryBrowserOverlay(
                            categories = browserCategories,
                            currentCategoryId = previewChannel?.categoryId,
                            onSelect = { catId -> liveVm.loadChannelsForCategory(catId) },
                            onDismiss = { liveVm.hideCategoryBrowser() },
                            modifier = Modifier.fillMaxSize(),
                        )
                    } else {
                        val audioChannels = zapChannels.filter { it.sourceId == previewChannel?.sourceId }
                        tv.own.owntv.features.shell.components.ChannelListOverlay(
                            channels = audioChannels,
                            currentId = previewChannel?.id,
                            nowPlaying = overlayNowPlaying,
                            title = stringResource(R.string.player_audio_source),
                            showNumbers = directTuneEnabled,
                            providerNames = liveProviderNames,
                            alignEnd = true,
                            onOpenCategories = { liveVm.showCategories() },
                            onSelect = { channel -> ExternalAudioController.setSource(channel.streamUrl, channel.name); showAudioSource = false; liveVm.hideCategoryBrowser() },
                            onDismiss = { showAudioSource = false; liveVm.hideCategoryBrowser() },
                            modifier = Modifier.fillMaxSize(),
                        )
                    }
                }

''' + anchor2
          r(shell,anchor2,block2)

          Path('app/src/main/res/values').mkdir(parents=True,exist_ok=True)
          Path('app/src/main/res/values/strings_audio_source.xml').write_text('<resources><string name="player_audio_source">Audio Source</string><string name="player_audio_original">Original Audio</string></resources>\n')
          Path('app/src/main/res/values-ar').mkdir(parents=True,exist_ok=True)
          Path('app/src/main/res/values-ar/strings_audio_source.xml').write_text('<resources><string name="player_audio_source">مصدر الصوت</string><string name="player_audio_original">الصوت الأصلي</string></resources>\n')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/tv/own/owntv/player/ExternalAudioController.kt app/src/main/java/tv/own/owntv/player/PlayerHudDialogs.kt app/src/main/java/tv/own/owntv/player/PlayerHud.kt app/src/main/java/tv/own/owntv/features/shell/OwnTVShell.kt app/src/main/res/values/strings_audio_source.xml app/src/main/res/values-ar/strings_audio_source.xml
          git commit -m 'Add external IPTV audio source picker'
          git rm .github/workflows/patch-audio-source.yml .github/workflows/patch-audio-source-v2.yml .github/workflows/patch-audio-source-v3.yml .github/workflows/patch-audio-source-v4.yml || true
          git commit -m 'Remove one-shot audio patch workflows' || true
          git push
