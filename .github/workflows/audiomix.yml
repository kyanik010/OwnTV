name: AudioMix IPTV Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout OwnTV
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools ndk;25.2.9519653 cmake;3.22.1'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Download GStreamer Android SDK
        run: |
          set -euo pipefail
          GST_VER="1.26.11"
          GST_DIR="$RUNNER_TEMP/gstreamer-1.0-android-universal-$GST_VER"
          ARCHIVE="$RUNNER_TEMP/gstreamer-android.tar.xz"
          if [ ! -d "$GST_DIR" ]; then
            curl -fL --retry 3 --retry-delay 5 \
              -o "$ARCHIVE" \
              "https://gstreamer.freedesktop.org/pkg/android/$GST_VER/gstreamer-1.0-android-universal-$GST_VER.tar.xz"
            tar -xJf "$ARCHIVE" -C "$RUNNER_TEMP"
          fi
          test -f "$GST_DIR/share/cmake/FindGStreamerMobile.cmake"
          echo "GSTREAMER_ROOT_ANDROID=$GST_DIR" >> "$GITHUB_ENV"
          echo "gstreamerRoot=$GST_DIR" >> "$HOME/.gradle/gradle.properties"
          echo "GStreamer SDK: $GST_DIR"
      - name: Build Core from AudioMix source
        run: |
          set -euo pipefail
          DEST="$RUNNER_TEMP/owntv-core"
          git init "$DEST"
          git -C "$DEST" remote add origin https://github.com/kyanik010/OwnTV_Core.git
          git -C "$DEST" fetch --depth 1 origin 0fc94afaec68e9a8596a2dfe4cd6e821fe1bf671
          git -C "$DEST" checkout --detach FETCH_HEAD
          python3 "$DEST/tools/i18n/check_hardcoded_strings.py" prune-safe
          echo "owntv.corePath=$DEST" >> "$HOME/.gradle/gradle.properties"
          grep -n "audioMixEnable\|audioMixDisable\|audioMixExternalAid" "$DEST/player-core/src/main/java/tv/own/owntv/player/OwnTVPlayer.kt" "$DEST/player-core/src/main/java/tv/own/owntv/player/PlaybackEngine.kt"
      - name: Verify AudioMix UI integration
        run: |
          set -euo pipefail
          grep -n "onAudioMix\|audioMixActive" app/src/main/java/tv/own/owntv/player/PlayerHud.kt app/src/main/java/tv/own/owntv/player/PlayerHudChrome.kt
          grep -n "showAudioMixList\|setAudioMixSource\|clearAudioMixSource" app/src/main/java/tv/own/owntv/features/shell/OwnTVShell.kt app/src/main/java/tv/own/owntv/features/live/LiveViewModel.kt
      - name: Compile and assemble AudioMix APK
        id: build_apk
        continue-on-error: true
        run: |
          chmod +x ./gradlew
          set -o pipefail
          ./gradlew :app:assembleStandardDebug --no-daemon --stacktrace --no-build-cache --no-configuration-cache 2>&1 | tee "$RUNNER_TEMP/audiomix-build.log"
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AudioMix-build-log
          path: ${{ runner.temp }}/audiomix-build.log
          if-no-files-found: error
      - name: Fail if build failed
        if: steps.build_apk.outcome == 'failure'
        run: exit 1
      - name: Locate APK
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/standard/debug -name '*.apk' -type f | head -n1)
          test -n "$APK"
          echo "APK=$APK" >> "$GITHUB_ENV"
      - name: Upload AudioMix APK
        uses: actions/upload-artifact@v4
        with:
          name: AudioMix-IPTV-debug
          path: ${{ env.APK }}
          if-no-files-found: error

# AudioMix build: OwnTV normal playback remains MPV; AudioMix uses the experimental one-pipeline GStreamer backend.
