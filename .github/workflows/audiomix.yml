name: AudioMix IPTV Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout OwnTV
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools ndk;25.2.9519653 cmake;3.22.1'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Download GStreamer Android SDK
        run: |
          set -euo pipefail
          GST_VER="1.28.7"
          GST_BASE="$HOME/.cache/owntv-gstreamer"
          ARCHIVE="$GST_BASE/gstreamer-android-$GST_VER.tar.xz"
          mkdir -p "$GST_BASE"
          rm -rf "$GST_BASE"/gstreamer-1.0-android-universal-* "$GST_BASE"/gstreamer-android-*.tar.xz
          curl -fL --retry 8 --retry-all-errors --retry-delay 10 --connect-timeout 60 --max-time 1800 -o "$ARCHIVE" "https://gstreamer.freedesktop.org/pkg/android/$GST_VER/gstreamer-1.0-android-universal-$GST_VER.tar.xz"
          ls -lh "$ARCHIVE"
          xz -t "$ARCHIVE"
          tar -xJf "$ARCHIVE" -C "$GST_BASE"
          rm -f "$ARCHIVE"
          FOUND_MODULE=$(find "$GST_BASE" -type f -name FindGStreamerMobile.cmake -print -quit)
          test -n "$FOUND_MODULE"
          ARM64_DIR=$(find "$GST_BASE" -type d -path "*/arm64" -print -quit)
          test -n "$ARM64_DIR"
          GST_DIR=$(dirname "$ARM64_DIR")
          test -f "$GST_DIR/arm64/share/gst-android/ndk-build/plugins.cmake"
          test -f "$GST_DIR/arm64/share/cmake/FindGStreamerMobile.cmake"
          echo "GSTREAMER_ROOT_ANDROID=$GST_DIR" >> "$GITHUB_ENV"
          echo "gstreamerRoot=$GST_DIR" >> "$HOME/.gradle/gradle.properties"

      - name: Build Core from AudioMix source
        run: |
          set -euo pipefail
          DEST="$RUNNER_TEMP/owntv-core"
          git init "$DEST"
          git -C "$DEST" remote add origin https://github.com/kyanik010/OwnTV_Core.git
          git -C "$DEST" fetch --depth 1 origin 44cffac782313f5c5c79f113049d08ff79a89cbb
          git -C "$DEST" checkout --detach FETCH_HEAD
          python3 "$DEST/tools/i18n/check_hardcoded_strings.py" prune-safe
          echo "owntv.corePath=$DEST" >> "$HOME/.gradle/gradle.properties"
          grep -n "audioMixEnable\|audioMixDisable\|audioMixExternalAid" "$DEST/player-core/src/main/java/tv/own/owntv/player/OwnTVPlayer.kt" "$DEST/player-core/src/main/java/tv/own/owntv/player/PlaybackEngine.kt"

      - name: Verify AudioMix UI integration
        run: |
          set -euo pipefail
          grep -n "onAudioMix\|audioMixActive" app/src/main/java/tv/own/owntv/player/PlayerHud.kt app/src/main/java/tv/own/owntv/player/PlayerHudChrome.kt
          grep -n "showAudioMixList\|setAudioMixSource\|clearAudioMixSource" app/src/main/java/tv/own/owntv/features/shell/OwnTVShell.kt app/src/main/java/tv/own/owntv/features/live/LiveViewModel.kt

      - name: Compile and assemble AudioMix APK
        id: build_apk
        continue-on-error: true
        run: |
          chmod +x ./gradlew
          set -o pipefail
          ./gradlew :app:assembleStandardDebug --no-daemon --stacktrace --no-build-cache --no-configuration-cache 2>&1 | tee "$RUNNER_TEMP/audiomix-build.log"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AudioMix-build-log
          path: ${{ runner.temp }}/audiomix-build.log
          if-no-files-found: ignore

      - name: Fail if build failed
        if: steps.build_apk.outcome == 'failure'
        run: exit 1

      - name: Locate APK
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/standard/debug -name '*.apk' -type f | head -n1)
          test -n "$APK"
          echo "APK=$APK" >> "$GITHUB_ENV"

      - name: Upload AudioMix APK
        uses: actions/upload-artifact@v4
        with:
          name: AudioMix-IPTV-debug
          path: ${{ env.APK }}
          if-no-files-found: error

# AudioMix build: OwnTV normal playback remains MPV; AudioMix uses the GStreamer backend.
