name: AudioMix IPTV Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout OwnTV
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build Core from AudioMix source
        run: |
          set -euo pipefail
          DEST="$RUNNER_TEMP/owntv-core"
          git init "$DEST"
          git -C "$DEST" remote add origin https://github.com/kyanik010/OwnTV_Core.git
          git -C "$DEST" fetch --depth 1 origin 821e32f07271081c24f58d7d4f960a45dcd601aa
          git -C "$DEST" checkout --detach FETCH_HEAD
          echo "owntv.corePath=$DEST" >> "$HOME/.gradle/gradle.properties"
          grep -n "audioMixEnable\|audioMixDisable\|audioMixExternalAid" "$DEST/player-core/src/main/java/tv/own/owntv/player/OwnTVPlayer.kt" "$DEST/player-core/src/main/java/tv/own/owntv/player/PlaybackEngine.kt"
      - name: Apply AudioMix app integration
        run: python3 tools/apply_audiomix_app_patch.py
      - name: Verify AudioMix app patch
        run: |
          set -euo pipefail
          grep -n "audioMixEnabled\|onAudioMix\|showAudioMixList" app/src/main/java/tv/own/owntv/player/PlayerHud.kt app/src/main/java/tv/own/owntv/player/PlayerHudChrome.kt app/src/main/java/tv/own/owntv/features/shell/OwnTVShell.kt
          grep -n "audioDelayStepMs" app/src/main/java/tv/own/owntv/player/PlayerHudDialogs.kt
      - name: Compile and assemble AudioMix APK
        id: build_apk
        continue-on-error: true
        run: |
          chmod +x ./gradlew
          set -o pipefail
          ./gradlew :app:assembleStandardDebug --no-daemon --stacktrace 2>&1 | tee "$RUNNER_TEMP/audiomix-build.log"
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AudioMix-build-log
          path: ${{ runner.temp }}/audiomix-build.log
          if-no-files-found: error
      - name: Fail if build failed
        if: steps.build_apk.outcome == 'failure'
        run: exit 1
      - name: Locate APK
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/standard/debug -name '*.apk' -type f | head -n1)
          test -n "$APK"
          echo "APK=$APK" >> "$GITHUB_ENV"
      - name: Upload AudioMix APK
        uses: actions/upload-artifact@v4
        with:
          name: AudioMix-IPTV-debug
          path: ${{ env.APK }}
          if-no-files-found: error
